<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>José Arthur - 5 anos</title>
<style>
  :root{
    --neon: #6bff3c;
  }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html, body{
    width:100%; height:100%;
    background:#000;
    overflow:hidden;
    font-family: Arial, Helvetica, sans-serif;
  }
  #app{
    position:fixed; inset:0;
    width:100%; height:100dvh;
    background:#000;
  }
  .screen{
    position:absolute; inset:0;
    width:100%; height:100%;
    display:none;
    align-items:center; justify-content:center;
    background:#000;
  }
  .screen.active{ display:flex; }
  .screen img, .screen video{
    width:100%; height:100%;
    object-fit:cover;
    object-position:center;
    display:block;
  }
  /* hotspots on interactive screen */
  .hotspot{
    position:absolute;
    background:transparent;
    /* debug: outline: 1px solid red; */
  }
  #hs-confirm{ left:0%;  top:71%; width:22%; height:19%; }
  #hs-local{   left:23%; top:71%; width:22%; height:19%; }
  #hs-gift{    left:46%; top:71%; width:22%; height:19%; }

  #hs-back{
    position:absolute; top:3%; left:4%;
    width:44px; height:44px;
    border-radius:50%;
    background:rgba(0,0,0,0.45);
    border:2px solid var(--neon);
    color:var(--neon);
    display:flex; align-items:center; justify-content:center;
    font-size:22px; font-weight:bold;
    box-shadow:0 0 12px rgba(107,255,60,0.8);
  }

  #tap-hint{
    position:absolute; left:0; right:0; bottom:6%;
    text-align:center;
    color:#fff;
    font-size:14px;
    letter-spacing:1px;
    opacity:0.85;
    text-shadow:0 0 8px rgba(0,0,0,0.9);
    animation: pulseHint 1.6s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes pulseHint{
    0%,100%{ opacity:0.4; }
    50%{ opacity:0.95; }
  }

  /* green smoke / flash transition overlay between screens */
  #transition-overlay{
    position:fixed; inset:0;
    z-index:50;
    pointer-events:none;
    opacity:0;
    background:
      radial-gradient(circle at 50% 40%, rgba(150,255,110,0.95) 0%, rgba(60,180,40,0.75) 25%, rgba(10,40,10,0.55) 55%, rgba(0,0,0,0) 78%);
    filter: blur(4px);
  }
  #transition-overlay.burst{
    animation: smokeBurst 0.55s ease-out;
  }
  @keyframes smokeBurst{
    0%{   opacity:0;    transform: scale(0.6); filter:blur(2px); }
    28%{  opacity:1;    transform: scale(1.05); filter:blur(6px); }
    100%{ opacity:0;    transform: scale(1.6);  filter:blur(14px); }
  }

  /* click flash - neon green light burst at tap point */
  .click-flash{
    position:fixed;
    width:26px; height:26px;
    left:0; top:0;
    margin-left:-13px; margin-top:-13px;
    border-radius:50%;
    background: radial-gradient(circle, rgba(210,255,190,1) 0%, rgba(120,255,70,0.9) 30%, rgba(80,255,40,0.5) 55%, rgba(80,255,40,0) 75%);
    box-shadow: 0 0 30px 12px rgba(110,255,60,0.85);
    z-index:60;
    pointer-events:none;
    animation: flashPulse 0.5s ease-out forwards;
  }
  @keyframes flashPulse{
    0%{   transform: scale(0.3); opacity:1; }
    60%{  transform: scale(2.6); opacity:0.75; }
    100%{ transform: scale(4.2); opacity:0; }
  }
</style>
</head>
<body>

<div id="app">

  <!-- 1. ABERTURA -->
  <div class="screen active" id="screen-abertura" data-action="start">
    <img src="assets/abertura.jpg" alt="Convite - clique para abrir">
  </div>

  <!-- 2. VIDEO 1 -->
  <div class="screen" id="screen-video1">
    <video id="video1" src="assets/video1.mp4" playsinline webkit-playsinline preload="auto"></video>
  </div>

  <!-- 3. VIDEO 2 -->
  <div class="screen" id="screen-video2">
    <video id="video2" src="assets/video2.mp4" playsinline webkit-playsinline preload="none"></video>
  </div>

  <!-- 4. INTERATIVO -->
  <div class="screen" id="screen-interativo">
    <img src="assets/interativo.jpg" alt="Detalhes da festa">
    <div class="hotspot" id="hs-confirm" data-action="confirm"></div>
    <div class="hotspot" id="hs-local" data-action="local"></div>
    <div class="hotspot" id="hs-gift" data-action="gift"></div>
  </div>

  <!-- 5. PRESENTES -->
  <div class="screen" id="screen-presentes">
    <img src="assets/presentes.jpg" alt="Sugestões de presente">
    <div id="hs-back" data-action="back">&#10094;</div>
  </div>

  <div id="transition-overlay"></div>
</div>

<!-- background music -->
<audio id="bgMusic" src="assets/audio.mp3" loop preload="auto"></audio>

<script>
(function(){
  var app = document.getElementById('app');
  var overlay = document.getElementById('transition-overlay');
  var bgMusic = document.getElementById('bgMusic');
  var video1 = document.getElementById('video1');
  var video2 = document.getElementById('video2');

  // ---- volume plan (based on loudness analysis of the uploaded files) ----
  // audio.mp3 (trilha) mean level ~ -13 dB / videos' own voice track ~ -10/-11 dB (louder).
  // So on screens with no competing speech the music can sit a bit higher,
  // and it must duck low under both videos so the child's voice stays clear.
  var VOL = { quiet: 0.34, ducked: 0.11 };
  bgMusic.volume = 0;

  var audioCtx = null;
  function ctx(){
    if(!audioCtx){
      var AC = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AC();
    }
    if(audioCtx.state === 'suspended'){ audioCtx.resume(); }
    return audioCtx;
  }

  function playClick(){
    try{
      var c = ctx();
      var o = c.createOscillator();
      var g = c.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(900, c.currentTime);
      o.frequency.exponentialRampToValueAtTime(240, c.currentTime + 0.09);
      g.gain.setValueAtTime(0.001, c.currentTime);
      g.gain.exponentialRampToValueAtTime(0.28, c.currentTime + 0.008);
      g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.14);
      o.connect(g); g.connect(c.destination);
      o.start();
      o.stop(c.currentTime + 0.15);
    }catch(e){}
  }

  function flashAt(x, y){
    var d = document.createElement('div');
    d.className = 'click-flash';
    d.style.left = x + 'px';
    d.style.top = y + 'px';
    document.body.appendChild(d);
    d.addEventListener('animationend', function(){ d.remove(); });
  }

  function fadeVolume(target, duration){
    duration = duration || 700;
    var start = bgMusic.volume;
    var t0 = performance.now();
    function step(now){
      var p = Math.min(1, (now - t0) / duration);
      bgMusic.volume = start + (target - start) * p;
      if(p < 1){ requestAnimationFrame(step); }
    }
    requestAnimationFrame(step);
  }

  function showScreen(id){
    var screens = document.querySelectorAll('.screen');
    for(var i=0;i<screens.length;i++){ screens[i].classList.remove('active'); }
    document.getElementById(id).classList.add('active');
  }

  function transitionTo(id, mid){
    overlay.classList.remove('burst');
    // force reflow so animation can restart
    void overlay.offsetWidth;
    overlay.classList.add('burst');
    setTimeout(function(){
      showScreen(id);
      if(mid) mid();
    }, 230);
  }

  var started = false;
  function startExperience(){
    if(started) return;
    started = true;
    ctx();
    bgMusic.currentTime = 0;
    bgMusic.play().catch(function(){});
    fadeVolume(VOL.ducked, 500);

    transitionTo('screen-video1', function(){
      video1.currentTime = 0;
      video1.play().catch(function(){});
      video2.preload = 'auto';
      video2.load();
    });
  }

  video1.addEventListener('ended', function(){
    transitionTo('screen-video2', function(){
      video2.currentTime = 0;
      video2.play().catch(function(){});
    });
  });

  video2.addEventListener('ended', function(){
    transitionTo('screen-interativo', function(){
      fadeVolume(VOL.quiet, 800);
    });
  });

  function goGift(){
    transitionTo('screen-presentes');
  }
  function goBack(){
    transitionTo('screen-interativo');
  }
  function goLocal(){
    window.open('https://maps.google.com/maps/place//data=!4m2!3m1!1s0x9299d36979c61017:0x599fbb1be30ddcb9?entry=s&sa=X&ved=2ahUKEwjYofamhJuWAxXBGrkGHdcAIT8Q4kB6BAgWEAA&hl=pt', '_blank');
  }
  function goConfirm(){
    window.open('https://wa.link/3gbpqd', '_blank');
  }

  app.addEventListener('click', function(e){
    var x = e.clientX, y = e.clientY;
    flashAt(x, y);
    playClick();

    var target = e.target.closest('[data-action]');
    if(!target) return;
    var action = target.getAttribute('data-action');

    switch(action){
      case 'start':   startExperience(); break;
      case 'gift':    goGift(); break;
      case 'back':    goBack(); break;
      case 'local':   goLocal(); break;
      case 'confirm': goConfirm(); break;
    }
  });

  // if the tab loses/regains focus keep music state consistent
  document.addEventListener('visibilitychange', function(){
    if(document.hidden){ /* keep playing, do nothing */ }
  });
})();
</script>
</body>
</html>
